<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DinoMascota - Tablero de Control Paleontológico | UAI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            dino: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card-hover:hover { transform: translateY(-4px); transition: all 0.25s ease; border-color: rgba(34, 197, 94, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = '';

    // =========================================================================
    // COMPONENTE: IMAGEN DE DINOSAURIO (CON FALLBACK ELEGANTE A EMOJI)
    // =========================================================================
    function DinoImage({ src, emoji = '🦖', alt = 'Dinosaurio', className = 'w-full h-48', imgClassName = '' }) {
      const [imgSrc, setImgSrc] = useState(src);
      const [hasError, setHasError] = useState(false);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setImgSrc(src);
        setHasError(!src);
        setLoading(true);
      }, [src]);

      return (
        <div className={`relative overflow-hidden rounded-xl bg-slate-950/80 flex items-center justify-center border border-slate-800/80 ${className}`}>
          {loading && !hasError && imgSrc && (
            <div className="absolute inset-0 flex items-center justify-center bg-slate-900/60 z-10 backdrop-blur-sm">
              <i className="fa-solid fa-circle-notch fa-spin text-slate-500 text-lg"></i>
            </div>
          )}

          {!hasError && imgSrc ? (
            <img
              src={imgSrc}
              alt={alt}
              className={`max-w-full max-h-full object-contain p-2 transition-transform duration-300 hover:scale-105 drop-shadow-[0_8px_20px_rgba(0,0,0,0.7)] ${imgClassName}`}
              onLoad={() => setLoading(false)}
              onError={() => {
                setHasError(true);
                setLoading(false);
              }}
            />
          ) : (
            <div className="flex flex-col items-center justify-center p-3 text-center select-none">
              <span className="text-4xl filter drop-shadow-md mb-1">{emoji}</span>
              <span className="text-[10px] text-slate-500 font-medium">Paleoarte no disponible</span>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: AUTENTICACIÓN (LOGIN, REGISTRO, VERIFICACIÓN Y RECUPERACIÓN)
    // =========================================================================
    function Login({ onLoginSuccess }) {
      const [mode, setMode] = useState('login'); // 'login', 'register', 'verify', 'forgot', 'reset'
      
      // Credenciales de Login
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('admin123');

      // Campos de Registro
      const [regUser, setRegUser] = useState('');
      const [regNombre, setRegNombre] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPass, setRegPass] = useState('');
      const [regConfirmPass, setRegConfirmPass] = useState('');

      // Campos de Verificación por Email
      const [verifyEmail, setVerifyEmail] = useState('');
      const [verifyCode, setVerifyCode] = useState('');

      // Campos de Recuperación de Contraseña
      const [forgotEmail, setForgotEmail] = useState('');
      const [resetCode, setResetCode] = useState('');
      const [resetPass, setResetPass] = useState('');
      const [resetConfirmPass, setResetConfirmPass] = useState('');

      // Estados de UI y feedback
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      const [loading, setLoading] = useState(false);
      const [devCode, setDevCode] = useState(null);

      const clearAlerts = () => {
        setError('');
        setSuccess('');
      };

      // 1. Manejo de Login
      const handleLogin = async (e) => {
        e.preventDefault();
        clearAlerts();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) {
            if (data.status === 'unverified') {
              setVerifyEmail(data.email || username);
              setMode('verify');
              setError('Tu cuenta aún no está verificada. Por favor ingresa el código enviado a tu correo.');
              return;
            }
            throw new Error(data.detail || 'Error al iniciar sesión');
          }
          onLoginSuccess(data.user, data.token);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // 2. Manejo de Registro
      const handleRegister = async (e) => {
        e.preventDefault();
        clearAlerts();
        if (regPass !== regConfirmPass) {
          setError('Las contraseñas no coinciden.');
          return;
        }
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: regUser,
              nombre_completo: regNombre,
              email: regEmail,
              password: regPass,
              confirm_password: regConfirmPass
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error en el registro');
          
          setVerifyEmail(data.email);
          setDevCode(data.dev_code || null);
          setSuccess(data.message);
          setMode('verify');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // 3. Manejo de Verificación de Email
      const handleVerifyEmail = async (e) => {
        e.preventDefault();
        clearAlerts();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/verify-email`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: verifyEmail, code: verifyCode })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al verificar correo');
          setSuccess(data.message);
          setMode('login');
          setUsername(verifyEmail);
          setPassword('');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // Reenviar código
      const handleResendCode = async () => {
        clearAlerts();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/resend-code`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: verifyEmail })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al reenviar código');
          setDevCode(data.dev_code || null);
          setSuccess(data.message);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // 4. Manejo de Olvido de Contraseña
      const handleForgotPassword = async (e) => {
        e.preventDefault();
        clearAlerts();
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: forgotEmail })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error en la solicitud');
          setDevCode(data.dev_code || null);
          setSuccess(data.message);
          setMode('reset');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      // 5. Manejo de Restablecimiento de Contraseña
      const handleResetPassword = async (e) => {
        e.preventDefault();
        clearAlerts();
        if (resetPass !== resetConfirmPass) {
          setError('Las contraseñas no coinciden.');
          return;
        }
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              email: forgotEmail,
              code: resetCode,
              new_password: resetPass,
              confirm_password: resetConfirmPass
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al restablecer contraseña');
          setSuccess(data.message);
          setMode('login');
          setUsername(forgotEmail);
          setPassword('');
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const setPreset = (u, p) => {
        setUsername(u);
        setPassword(p);
        clearAlerts();
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
          <div className="max-w-md w-full glass-card rounded-2xl p-8 shadow-2xl border border-slate-800 my-8">
            <div className="text-center mb-6">
              <div className="w-16 h-16 mx-auto bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow-lg shadow-emerald-500/10">
                🦖
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">DinoMascota</h1>
              <p className="text-xs text-emerald-400 font-semibold tracking-wider uppercase mt-0.5">Tablero Paleontológico • UAI</p>
              <p className="text-[11px] text-slate-400 mt-1">Bases de Datos Aplicada — Autenticación SHA-256</p>
            </div>

            {/* Selector de pestañas principales (Iniciar Sesión / Registro) */}
            {(mode === 'login' || mode === 'register') && (
              <div className="flex bg-slate-900/90 p-1 rounded-xl border border-slate-800 mb-6">
                <button
                  type="button"
                  onClick={() => { setMode('login'); clearAlerts(); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition cursor-pointer ${
                    mode === 'login' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i className="fa-solid fa-right-to-bracket mr-1.5"></i> Iniciar Sesión
                </button>
                <button
                  type="button"
                  onClick={() => { setMode('register'); clearAlerts(); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition cursor-pointer ${
                    mode === 'register' ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                  }`}
                >
                  <i className="fa-solid fa-user-plus mr-1.5"></i> Crear Cuenta
                </button>
              </div>
            )}

            {/* Alertas globales de Error / Éxito */}
            {error && (
              <div className="mb-5 p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2 animate-in fade-in">
                <i className="fa-solid fa-triangle-exclamation text-base shrink-0"></i>
                <span>{error}</span>
              </div>
            )}

            {success && (
              <div className="mb-5 p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs flex items-center gap-2 animate-in fade-in">
                <i className="fa-solid fa-circle-check text-base shrink-0"></i>
                <span>{success}</span>
              </div>
            )}

            {/* Banner de Modo Simulación Local (Docente / Offline) */}
            {devCode && (
              <div className="mb-5 p-3.5 rounded-xl bg-cyan-950/40 border border-cyan-500/40 text-cyan-300 text-xs flex flex-col gap-1.5 animate-in fade-in">
                <div className="flex items-center justify-between">
                  <span className="font-bold flex items-center gap-1.5">
                    <i className="fa-solid fa-envelope-open-text text-cyan-400"></i>
                    <span>[Modo Simulación Académico]</span>
                  </span>
                  <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-mono">Dev Token</span>
                </div>
                <p className="text-[11px] text-slate-300">
                  Código de 6 dígitos enviado a consola: <strong className="text-white tracking-widest text-sm font-mono">{devCode}</strong>
                </p>
                <button
                  type="button"
                  onClick={() => {
                    if (mode === 'verify') setVerifyCode(devCode);
                    if (mode === 'reset') setResetCode(devCode);
                  }}
                  className="mt-1 py-1 px-2.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-200 rounded-lg text-[10px] font-semibold transition self-start cursor-pointer border border-cyan-500/30"
                >
                  ⚡ Autocompletar código
                </button>
              </div>
            )}

            {/* ========================================================= */}
            {/* VISTA 1: INICIAR SESIÓN */}
            {/* ========================================================= */}
            {mode === 'login' && (
              <div>
                <form onSubmit={handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Usuario o Email</label>
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i className="fa-solid fa-user"></i>
                      </span>
                      <input
                        type="text"
                        required
                        value={username}
                        onChange={(e) => setUsername(e.target.value)}
                        className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                        placeholder="admin o usuario@uai.edu.ar"
                      />
                    </div>
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1.5">
                      <label className="text-xs font-semibold text-slate-300 uppercase tracking-wider">Contraseña</label>
                      <button
                        type="button"
                        onClick={() => { setMode('forgot'); clearAlerts(); }}
                        className="text-[11px] text-emerald-400 hover:underline cursor-pointer"
                      >
                        ¿Olvidaste tu contraseña?
                      </button>
                    </div>
                    <div className="relative">
                      <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i className="fa-solid fa-lock"></i>
                      </span>
                      <input
                        type="password"
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                        placeholder="••••••••"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    disabled={loading}
                    className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-5 cursor-pointer disabled:opacity-50"
                  >
                    {loading ? (
                      <>
                        <i className="fa-solid fa-circle-notch fa-spin"></i>
                        <span>Verificando hash SHA-256...</span>
                      </>
                    ) : (
                      <>
                        <span>Ingresar al Tablero</span>
                        <i className="fa-solid fa-arrow-right"></i>
                      </>
                    )}
                  </button>
                </form>

                {/* Acceso rápido a usuarios predefinidos */}
                <div className="mt-7 pt-5 border-t border-slate-800">
                  <p className="text-[10px] text-slate-400 text-center font-semibold mb-2.5 uppercase tracking-wider">
                    Usuarios de prueba en Base de Datos (SHA-256 + Salt):
                  </p>
                  <div className="grid grid-cols-3 gap-2">
                    <button
                      type="button"
                      onClick={() => setPreset('admin', 'admin123')}
                      className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                    >
                      <div className="font-bold text-white">admin</div>
                      <div className="text-[9px] text-emerald-400 font-mono">admin123</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => setPreset('profesor', 'uai2026')}
                      className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                    >
                      <div className="font-bold text-white">profesor</div>
                      <div className="text-[9px] text-emerald-400 font-mono">uai2026</div>
                    </button>
                    <button
                      type="button"
                      onClick={() => setPreset('alumno', 'dino123')}
                      className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                    >
                      <div className="font-bold text-white">alumno</div>
                      <div className="text-[9px] text-emerald-400 font-mono">dino123</div>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* VISTA 2: CREAR CUENTA (REGISTRO) */}
            {/* ========================================================= */}
            {mode === 'register' && (
              <form onSubmit={handleRegister} className="space-y-3.5">
                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Nombre de Usuario</label>
                  <input
                    type="text"
                    required
                    value={regUser}
                    onChange={(e) => setRegUser(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="ej: juan_perez"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Nombre Completo</label>
                  <input
                    type="text"
                    required
                    value={regNombre}
                    onChange={(e) => setRegNombre(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="ej: Juan Pérez"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
                  <input
                    type="email"
                    required
                    value={regEmail}
                    onChange={(e) => setRegEmail(e.target.value)}
                    className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                    placeholder="juan.perez@alumnos.uai.edu.ar"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2.5">
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
                    <input
                      type="password"
                      required
                      value={regPass}
                      onChange={(e) => setRegPass(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                      placeholder="••••••••"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Confirmar Clave</label>
                    <input
                      type="password"
                      required
                      value={regConfirmPass}
                      onChange={(e) => setRegConfirmPass(e.target.value)}
                      className="w-full px-3.5 py-2 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition"
                      placeholder="••••••••"
                    />
                  </div>
                </div>

                <p className="text-[11px] text-slate-400 leading-tight">
                  <i className="fa-solid fa-shield-halved text-emerald-400 mr-1"></i>
                  La clave se almacenará encriptada con <strong>SHA-256 + Salt criptográfico</strong>.
                </p>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-4 cursor-pointer disabled:opacity-50"
                >
                  {loading ? (
                    <>
                      <i className="fa-solid fa-circle-notch fa-spin"></i>
                      <span>Creando usuario y enviando código...</span>
                    </>
                  ) : (
                    <>
                      <span>Registrarme y Recibir Código</span>
                      <i className="fa-solid fa-paper-plane"></i>
                    </>
                  )}
                </button>
              </form>
            )}

            {/* ========================================================= */}
            {/* VISTA 3: VERIFICACIÓN DE EMAIL */}
            {/* ========================================================= */}
            {mode === 'verify' && (
              <form onSubmit={handleVerifyEmail} className="space-y-4">
                <div className="text-center p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                  <i className="fa-solid fa-envelope text-2xl text-emerald-400 mb-1.5"></i>
                  <h3 className="text-sm font-bold text-white">Verificación de Correo</h3>
                  <p className="text-xs text-slate-300 mt-1">
                    Ingresa el código de 6 dígitos que enviamos a:
                  </p>
                  <p className="text-xs font-semibold text-emerald-400 break-all mt-0.5">{verifyEmail}</p>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 text-center">
                    Código de Seguridad (6 Dígitos)
                  </label>
                  <input
                    type="text"
                    required
                    maxLength={6}
                    value={verifyCode}
                    onChange={(e) => setVerifyCode(e.target.value.trim())}

    function SemaforoBadge({ score, showLabel = true }) {
      let colorClass = 'bg-red-500/20 text-red-400 border-red-500/30';
      let dotColor = 'bg-red-500';
      let label = 'ROJO • Riesgo Letal';

      if (score >= 70) {
        colorClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        dotColor = 'bg-emerald-500';
        label = 'VERDE • Mascota Ideal';
      } else if (score >= 40) {
        colorClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        dotColor = 'bg-amber-500';
        label = 'AMARILLO • Precaución';
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${colorClass}`}>
          <span className={`w-2 h-2 rounded-full ${dotColor} animate-pulse`}></span>
          <span>{score}/100</span>
          {showLabel && <span className="text-[10px] opacity-80 ml-1">({label.split('•')[0].trim()})</span>}
        </span>
      );
    }

    // COMPONENTE: VISTA DEL BUSCADOR MULTIFILTRO
    // =========================================================================
    function SearchView({ onOpenDetail, onSelectForCompare }) {
      const [query, setQuery] = useState('');
      const [periodoId, setPeriodoId] = useState('');
      const [habitatId, setHabitatId] = useState('');
      const [dietaId, setDietaId] = useState('');
      const [semaforo, setSemaforo] = useState('');
      const [sortBy, setSortBy] = useState('mascotabilidad_desc');
      
      const [results, setResults] = useState([]);
      const [totalCount, setTotalCount] = useState(0);
      const [loading, setLoading] = useState(true);

      const performSearch = () => {
        setLoading(true);
        const params = new URLSearchParams();
        if (query) params.append('q', query);
        if (periodoId) params.append('periodo_id', periodoId);
        if (habitatId) params.append('habitat_id', habitatId);
        if (dietaId) params.append('dieta_id', dietaId);
        if (semaforo) params.append('semaforo', semaforo);
        if (sortBy) params.append('sort_by', sortBy);

        fetch(`${API_BASE}/api/stats/search?${params.toString()}`)
          .then(res => res.json())
          .then(data => {
            setResults(data.dinosaurios || []);
            setTotalCount(data.total_resultados || 0);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      };

      useEffect(() => {
        const timeout = setTimeout(performSearch, 200);
        return () => clearTimeout(timeout);
      }, [query, periodoId, habitatId, dietaId, semaforo, sortBy]);

      const resetFilters = () => {
        setQuery('');
        setPeriodoId('');
        setHabitatId('');
        setDietaId('');
        setSemaforo('');
        setSortBy('mascotabilidad_desc');
      };

                <i className="fa-solid fa-rotate-left text-[10px]"></i>
                <span>Limpiar Filtros</span>
              </button>
            </div>

            {/* Input de Búsqueda Principal */}
            <div className="relative">
              <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                <i className="fa-solid fa-search"></i>
              </span>
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar por nombre (ej. Velociraptor, Rex, Diplodocus), especie o características..."

    // COMPONENTE: GESTIÓN DE USUARIOS (PANEL DE ADMINISTRACIÓN)
    // =========================================================================
    function AdminUsersView({ currentUser }) {
      const [users, setUsers] = useState([]);
      const [loading, setLoading] = useState(true);
      const [search, setSearch] = useState('');
      const [error, setError] = useState('');
      const [success, setSuccess] = useState('');
      
      // Modal Crear Usuario
      const [showCreateModal, setShowCreateModal] = useState(false);
      const [newUsername, setNewUsername] = useState('');
      const [newNombre, setNewNombre] = useState('');
      const [newEmail, setNewEmail] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [newRole, setNewRole] = useState('alumno');
      const [autoVerify, setAutoVerify] = useState(true);
      const [creating, setCreating] = useState(false);

      // Modal Eliminar Usuario
      const [userToDelete, setUserToDelete] = useState(null);
      const [deleting, setDeleting] = useState(false);

      const loadUsers = () => {
        setLoading(true);
        fetch(`${API_BASE}/api/admin/users`)
          .then(res => res.json())
          .then(data => {
            if (data.status === 'success') {
              setUsers(data.users);
            }
          })
          .catch(err => setError(err.message))
          .finally(() => setLoading(false));
      };

      useEffect(() => {
        loadUsers();
      }, []);

      const handleRoleChange = async (userId, targetRole) => {
        setError('');
        setSuccess('');
        try {
          const res = await fetch(`${API_BASE}/api/admin/users/${userId}/role`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ rol: targetRole })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al modificar rol');
          setSuccess(data.message);
          loadUsers();
        } catch (err) {
          setError(err.message);
        }
      };

      const handleCreateUser = async (e) => {
        e.preventDefault();
        setError('');
        setSuccess('');
        setCreating(true);
        try {
          const res = await fetch(`${API_BASE}/api/admin/users`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: newUsername,
              nombre_completo: newNombre,
              email: newEmail,
              password: newPassword,
              rol: newRole,
              verificado: autoVerify
            })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al crear usuario');
          setSuccess(data.message);
          setShowCreateModal(false);
          setNewUsername('');
          setNewNombre('');
          setNewEmail('');
          setNewPassword('');
          setNewRole('alumno');
          loadUsers();
        } catch (err) {
          setError(err.message);
        } finally {
          setCreating(false);
        }
      };

      const handleDeleteUser = async () => {
        if (!userToDelete) return;
        setError('');
        setSuccess('');
        setDeleting(true);
        try {
          const res = await fetch(`${API_BASE}/api/admin/users/${userToDelete.id}?current_user_id=${currentUser.id}`, {
            method: 'DELETE'
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al eliminar usuario');
          setSuccess(data.message);
          setUserToDelete(null);
          loadUsers();
        } catch (err) {
          setError(err.message);
          setUserToDelete(null);
        } finally {
          setDeleting(false);
        }
      };

      // Filtro de usuarios
      const filteredUsers = users.filter(u => {
        const q = search.toLowerCase();
        return (
          u.username.toLowerCase().includes(q) ||
          u.email.toLowerCase().includes(q) ||
          u.nombre_completo.toLowerCase().includes(q) ||
          u.rol.toLowerCase().includes(q)
        );
      });

      const roleBadgeClasses = {
        administrador: 'bg-purple-500/20 text-purple-300 border-purple-500/30',
        docente: 'bg-blue-500/20 text-blue-300 border-blue-500/30',
        investigador: 'bg-cyan-500/20 text-cyan-300 border-cyan-500/30',
        alumno: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30',
      };

      return (
        <div className="space-y-6 animate-in fade-in duration-200">
          {/* Header del Panel */}
          <div className="glass-card p-6 rounded-2xl border border-slate-800 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-2 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20">

                </span>
                <h2 className="text-xl font-bold text-white">Administración y Control de Usuarios</h2>
              </div>
              <p className="text-xs text-slate-400 mt-1">
                Gestión de cuentas persistidas en SQLite, actualización de roles y seguridad con hashing SHA-256.
              </p>
            </div>

            <div className="flex items-center gap-3">
              <button
                onClick={() => { setShowCreateModal(true); setError(''); setSuccess(''); }}
                className="px-4 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold rounded-xl text-xs shadow-lg shadow-purple-600/30 transition flex items-center gap-2 cursor-pointer"
              >
                <i className="fa-solid fa-user-plus"></i>
                <span>Nuevo Usuario</span>
              </button>
            </div>
          </div>

          {/* Notificaciones */}
          {error && (
            <div className="p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center justify-between animate-in fade-in">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-base"></i>

          {success && (

              </div>

          {/* Métricas rápidas de cuentas */}

            </div>
            <div className="glass-card p-4 rounded-xl border border-slate-800">
              <span className="text-[11px] uppercase font-bold text-purple-400">Administradores</span>
              <div className="text-2xl font-black text-purple-300 mt-0.5">
                {users.filter(u => u.rol === 'administrador').length}

            </div>
            <div className="glass-card p-4 rounded-xl border border-slate-800">

              <div className="text-2xl font-black text-blue-300 mt-0.5">

            </div>
            <div className="glass-card p-4 rounded-xl border border-slate-800">
              <span className="text-[11px] uppercase font-bold text-emerald-400">Alumnos</span>
              <div className="text-2xl font-black text-emerald-300 mt-0.5">
                {users.filter(u => u.rol === 'alumno').length}

            </div>
          </div>

          {/* Tabla de Usuarios con Buscador */}
          <div className="glass-card rounded-2xl border border-slate-800 overflow-hidden">
            <div className="p-4 border-b border-slate-800 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div className="relative flex-1 max-w-md">
                <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">

                </span>
                <input

                />
              </div>

              <div className="text-xs text-slate-400">
                Mostrando <strong className="text-white">{filteredUsers.length}</strong> de {users.length} usuarios

            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-slate-800 bg-slate-900/60 text-slate-400 uppercase font-semibold text-[10px] tracking-wider">

                    <th className="py-3 px-4">Correo Electrónico</th>

                  {loading ? (

                      <td colSpan="6" className="py-8 text-center text-slate-500">

                    filteredUsers.map(u => (

                        <td className="py-3.5 px-4">

                              <option value="alumno" className="bg-slate-900 text-emerald-300">Alumno</option>

                          </div>
                        </td>
                        <td className="py-3.5 px-4">

                              <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>

                            className={`p-1.5 rounded-lg border transition cursor-pointer ${
                              u.id === currentUser.id
                                ? 'opacity-30 border-slate-800 text-slate-600 cursor-not-allowed'

                          >
                            <i className="fa-solid fa-trash-can text-xs"></i>
                          </button>
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* MODAL: CREAR NUEVO USUARIO */}
          {showCreateModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card max-w-md w-full rounded-2xl border border-slate-700 shadow-2xl p-6 animate-in zoom-in-95 duration-150">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="text-base font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-user-plus text-purple-400"></i>
                    <span>Crear Usuario Administrativo</span>
                  </h3>
                  <button onClick={() => setShowCreateModal(false)} className="text-slate-400 hover:text-white cursor-pointer">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <form onSubmit={handleCreateUser} className="space-y-3.5 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Nombre de Usuario</label>
                    <input
                      type="text"
                      required
                      value={newUsername}
                      onChange={(e) => setNewUsername(e.target.value)}
                      placeholder="ej: profesor_garcia"
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Nombre Completo</label>
                    <input
                      type="text"
                      required
                      value={newNombre}
                      onChange={(e) => setNewNombre(e.target.value)}
                      placeholder="ej: Dr. Roberto García"
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"
                    />
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
                    <input
                      type="email"
                      required
                      value={newEmail}
                      onChange={(e) => setNewEmail(e.target.value)}
                      placeholder="roberto.garcia@uai.edu.ar"
                      className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2.5">
                    <div>
                      <label className="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
                      <input
                        type="password"
                        required
                        value={newPassword}
                        onChange={(e) => setNewPassword(e.target.value)}
                        placeholder="••••••••"
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-purple-500 transition"
                      />
                    </div>
                    <div>
                      <label className="block font-semibold text-slate-300 uppercase tracking-wider mb-1">Rol Asignado</label>
                      <select
                        value={newRole}
                        onChange={(e) => setNewRole(e.target.value)}
                        className="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white focus:outline-none focus:border-purple-500 transition cursor-pointer"
                      >
                        <option value="administrador">Administrador</option>
                        <option value="docente">Docente</option>
                        <option value="investigador">Investigador</option>
                        <option value="alumno">Alumno</option>
                      </select>
                    </div>
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input
                      type="checkbox"
                      id="autoVerify"
                      checked={autoVerify}
                      onChange={(e) => setAutoVerify(e.target.checked)}
                      className="rounded border-slate-700 text-purple-600 focus:ring-purple-500 cursor-pointer"
                    />
                    <label htmlFor="autoVerify" className="text-slate-300 cursor-pointer select-none">
                      Marcar cuenta como ya verificada (sin requerir confirmación por mail)
                    </label>

                  <div className="flex justify-end gap-2 pt-3">
                    <button
                      type="button"
                      onClick={() => setShowCreateModal(false)}

                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      disabled={creating}
                      className="px-4 py-2 bg-purple-600 hover:bg-purple-500 text-white rounded-xl font-semibold transition cursor-pointer flex items-center gap-2"
                    >
                      {creating && <i className="fa-solid fa-circle-notch fa-spin"></i>}
                      <span>Guardar Usuario</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL: CONFIRMAR ELIMINACIÓN */}
          {userToDelete && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="glass-card max-w-sm w-full rounded-2xl border border-red-500/30 p-6 animate-in zoom-in-95 duration-150 text-center">
                <div className="w-12 h-12 mx-auto bg-red-500/10 border border-red-500/30 text-red-400 rounded-full flex items-center justify-center text-xl mb-3">
                  <i className="fa-solid fa-trash-can"></i>
                </div>
                <h3 className="text-base font-bold text-white">¿Eliminar este usuario?</h3>

                </p>

                <div className="flex justify-center gap-3 mt-6">

    }

    // =========================================================================
    // COMPONENTE: TABLERO PRINCIPAL (DASHBOARD)
    // =========================================================================
    function Dashboard({ user, onLogout }) {
      const [currentTab, setCurrentTab] = useState('drilldown'); // 'drilldown', 'search', 'comparator', 'users'
      
      const [kpis, setKpis] = useState(null);
      const [drillLevel, setDrillLevel] = useState(1); // 1 = Periodos, 2 = Habitats, 3 = Dinosaurios
      const [selectedPeriodo, setSelectedPeriodo] = useState(null);
      const [selectedHabitat, setSelectedHabitat] = useState(null);

      const [periodos, setPeriodos] = useState([]);
      const [habitatsData, setHabitatsData] = useState(null);
      const [dinosData, setDinosData] = useState(null);
      
      const [allDinos, setAllDinos] = useState([]);
      const [selectedDinoId, setSelectedDinoId] = useState(null);
      const [comparatorDino1, setComparatorDino1] = useState(1);
      const [comparatorDino2, setComparatorDino2] = useState(2);

      // Cargar KPIs iniciales, Nivel 1 y Lista total de Dinos
      useEffect(() => {
        fetch(`${API_BASE}/api/stats/kpis`)
          .then(res => res.json())
          .then(data => setKpis(data));

        fetch(`${API_BASE}/api/stats/drilldown/periodos`)
          .then(res => res.json())
          .then(data => setPeriodos(data));

        fetch(`${API_BASE}/api/dinos/all`)
          .then(res => res.json())
          .then(data => {
            setAllDinos(data || []);
            if (data && data.length >= 2) {
              setComparatorDino1(data[0].id_dinosaurio);
              setComparatorDino2(data[1].id_dinosaurio);
            }
          });
      }, []);

      // Drill Down hacia Nivel 2 (Hábitats)
      const handleSelectPeriodo = (p) => {
        setSelectedPeriodo(p);
        fetch(`${API_BASE}/api/stats/drilldown/habitats/${p.id_periodo}`)
          .then(res => res.json())
          .then(data => {
            setHabitatsData(data);
            setDrillLevel(2);
          });
      };

      // Drill Down hacia Nivel 3 (Dinosaurios)
      const handleSelectHabitat = (h) => {
        setSelectedHabitat(h);
        fetch(`${API_BASE}/api/stats/drilldown/dinosaurios/${selectedPeriodo.id_periodo}/${h.id_habitat}`)
          .then(res => res.json())
          .then(data => {
            setDinosData(data);
            setDrillLevel(3);
          });
      };

      // Drill Up
      const handleDrillUp = (toLevel) => {
        if (toLevel === 1) {
          setDrillLevel(1);
          setSelectedPeriodo(null);
          setSelectedHabitat(null);
          setHabitatsData(null);
          setDinosData(null);
        } else if (toLevel === 2) {
          setDrillLevel(2);
          setSelectedHabitat(null);
          setDinosData(null);
        }
      };

      // Manejar selección rápida para Comparador
      const handleSelectForCompare = (dinoId) => {
        setComparatorDino1(dinoId);
        if (comparatorDino2 === dinoId) {
          const alternative = allDinos.find(d => d.id_dinosaurio !== dinoId);
          if (alternative) setComparatorDino2(alternative.id_dinosaurio);
        }
        setCurrentTab('comparator');
      };

      return (
        <div className="min-h-screen pb-16">
          {/* Top Navbar con Pestañas */}
          <nav className="glass-card border-b border-slate-800 sticky top-0 z-40 px-4 sm:px-6 py-3.5 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-xl shadow-md">
                  🦖
                </div>
                <div>
                  <span className="font-extrabold text-white text-base tracking-tight block">DinoMascota</span>
                  <span className="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Tablero Paleontológico • UAI</span>
                </div>
              </div>

              {/* Botón Logout móvil */}
              <button
                onClick={onLogout}
                className="md:hidden p-2 rounded-xl bg-red-500/10 text-red-400 border border-red-500/20 text-xs"
              >
                <i className="fa-solid fa-arrow-right-from-bracket"></i>
              </button>
            </div>

            {/* Pestañas de Navegación del Dashboard */}
            <div className="flex items-center gap-1.5 p-1 bg-slate-900/90 rounded-xl border border-slate-800 overflow-x-auto custom-scroll">
              <button
                onClick={() => setCurrentTab('drilldown')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 whitespace-nowrap cursor-pointer ${
                  currentTab === 'drilldown'
                    ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                }`}
              >
                <i className="fa-solid fa-layer-group"></i>
                <span>Tablero & Drill-Down</span>
              </button>

              <button
                onClick={() => setCurrentTab('search')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 whitespace-nowrap cursor-pointer ${
                  currentTab === 'search'
                    ? 'bg-emerald-600 text-white shadow-md shadow-emerald-600/20'
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                }`}
              >
                <i className="fa-solid fa-magnifying-glass"></i>
                <span>Buscador de Especies</span>
                <span className="text-[10px] px-1.5 py-0.2 rounded-full bg-emerald-500/20 text-emerald-300 font-mono">52</span>
              </button>

              <button
                onClick={() => setCurrentTab('comparator')}
                className={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-2 whitespace-nowrap cursor-pointer ${
                  currentTab === 'comparator'
                    ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                    : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                }`}
              >
                <i className="fa-solid fa-code-compare"></i>
                <span>Comparador Cara a Cara</span>
              </button>

              {user.rol === 'administrador' && (
                <button
                  onClick={() => setCurrentTab('users')}

    // =========================================================================
    // RENDERIZADOR DE CHART.JS CUANDO CARGA EL DASHBOARD
    // =========================================================================
    function initCharts() {
      fetch(`${API_BASE}/api/stats/charts/dietas`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('dietasChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: data.map(d => d.tipo.split(' ')[0]),
              datasets: [{
                data: data.map(d => d.cantidad),
                backgroundColor: ['#22c55e', '#ef4444', '#06b6d4', '#eab308', '#a855f7'],
                borderColor: '#0f172a',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });

      fetch(`${API_BASE}/api/stats/charts/periodos`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('periodosChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: data.map(d => d.periodo),
              datasets: [{
                label: 'Mascotabilidad Promedio (0-100)',
                data: data.map(d => d.mascotabilidad_promedio),
                backgroundColor: '#22c55e',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { beginAtZero: true, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
              },
              plugins: {
                legend: { labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });
    }

    // =========================================================================
    // COMPONENTE RAÍZ
    // =========================================================================
    function App() {
      const [user, setUser] = useState(null);

      const handleLoginSuccess = (userData, token) => {
        setUser(userData);
        setTimeout(initCharts, 300);
      };

      const handleLogout = () => {
        setUser(null);
      };

      if (!user) {
        return <Login onLoginSuccess={handleLoginSuccess} />;
      }

      return <Dashboard user={user} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

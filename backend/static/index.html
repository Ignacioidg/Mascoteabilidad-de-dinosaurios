<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DinoMascota - Tablero de Control Paleontológico | UAI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            dino: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card-hover:hover { transform: translateY(-4px); transition: all 0.25s ease; border-color: rgba(34, 197, 94, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = '';

    // =========================================================================
    // COMPONENTE: IMAGEN DE DINOSAURIO (CON FALLBACK ELEGANTE A EMOJI)
    // =========================================================================
    function DinoImage({ src, emoji = '🦖', alt = 'Dinosaurio', className = 'w-full h-40', imgClassName = 'object-cover' }) {
      const [imgSrc, setImgSrc] = useState(src);
      const [hasError, setHasError] = useState(false);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        setImgSrc(src);
        setHasError(!src);
        setLoading(true);
      }, [src]);

      return (
        <div className={`relative overflow-hidden rounded-xl bg-slate-900/90 flex items-center justify-center border border-slate-800 ${className}`}>
          {loading && !hasError && imgSrc && (
            <div className="absolute inset-0 flex items-center justify-center bg-slate-900/80 z-10">
              <i className="fa-solid fa-circle-notch fa-spin text-slate-600 text-lg"></i>
            </div>
          )}

          {!hasError && imgSrc ? (
            <img
              src={imgSrc}
              alt={alt}
              className={`w-full h-full transition duration-300 hover:scale-105 ${imgClassName}`}
              onLoad={() => setLoading(false)}
              onError={() => {
                setHasError(true);
                setLoading(false);
              }}
            />
          ) : (
            <div className="flex flex-col items-center justify-center p-3 text-center select-none">
              <span className="text-4xl filter drop-shadow-md mb-1">{emoji}</span>
              <span className="text-[10px] text-slate-500 font-medium">Paleoarte no disponible</span>
            </div>
          )}
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: LOGIN
    // =========================================================================
    function Login({ onLoginSuccess }) {
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('admin123');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al iniciar sesión');
          onLoginSuccess(data.user, data.token);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const setPreset = (u, p) => {
        setUsername(u);
        setPassword(p);
        setError('');
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
          <div className="max-w-md w-full glass-card rounded-2xl p-8 shadow-2xl border border-slate-800">
            <div className="text-center mb-8">
              <div className="w-20 h-20 mx-auto bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-lg shadow-emerald-500/10">
                🦖
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">DinoMascota</h1>
              <p className="text-xs text-emerald-400 font-semibold tracking-wider uppercase mt-1">Tablero de Control Paleontológico</p>
              <p className="text-xs text-slate-400 mt-2">Bases de Datos Aplicada — UAI</p>
            </div>

            {error && (
              <div className="mb-6 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-base"></i>
                <span>{error}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuario</label>
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i className="fa-solid fa-user"></i>
                  </span>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                    placeholder="Ingresa tu usuario"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i className="fa-solid fa-lock"></i>
                  </span>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                    placeholder="••••••••"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-6 cursor-pointer"
              >
                {loading ? (
                  <>
                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                    <span>Verificando credenciales SQL...</span>
                  </>
                ) : (
                  <>
                    <span>Ingresar al Tablero</span>
                    <i className="fa-solid fa-arrow-right"></i>
                  </>
                )}
              </button>
            </form>

            <div className="mt-8 pt-6 border-t border-slate-800">
              <p className="text-[11px] text-slate-400 text-center font-medium mb-3 uppercase tracking-wider">
                Credenciales de prueba registradas en BD (Hash Bcrypt):
              </p>
              <div className="grid grid-cols-3 gap-2">
                <button
                  type="button"
                  onClick={() => setPreset('admin', 'admin123')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">admin</div>
                  <div className="text-[9px] text-slate-500">admin123</div>
                </button>
                <button
                  type="button"
                  onClick={() => setPreset('profesor', 'uai2026')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">profesor</div>
                  <div className="text-[9px] text-slate-500">uai2026</div>
                </button>
                <button
                  type="button"
                  onClick={() => setPreset('alumno', 'dino123')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">alumno</div>
                  <div className="text-[9px] text-slate-500">dino123</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: BADGE DE SEMAFORIZACIÓN
    // =========================================================================
    function SemaforoBadge({ score, showLabel = true }) {
      let colorClass = 'bg-red-500/20 text-red-400 border-red-500/30';
      let dotColor = 'bg-red-500';
      let label = 'ROJO • Riesgo Letal';

      if (score >= 70) {
        colorClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        dotColor = 'bg-emerald-500';
        label = 'VERDE • Mascota Ideal';
      } else if (score >= 40) {
        colorClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        dotColor = 'bg-amber-500';
        label = 'AMARILLO • Precaución';
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${colorClass}`}>
          <span className={`w-2 h-2 rounded-full ${dotColor} animate-pulse`}></span>
          <span>{score}/100</span>
          {showLabel && <span className="text-[10px] opacity-80 ml-1">({label.split('•')[0].trim()})</span>}
        </span>
      );
    }

    // =========================================================================
    // COMPONENTE: MODAL DE FICHA TÉCNICA (DETALLE DEL DINOSAURIO)
    // =========================================================================
    function DinoModal({ dinoId, onClose, onSelectForCompare }) {
      const [dino, setDino] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!dinoId) return;
        setLoading(true);
        fetch(`${API_BASE}/api/stats/dinosaurio/${dinoId}`)
          .then(res => res.json())
          .then(data => {
            setDino(data);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      }, [dinoId]);

      if (!dinoId) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="glass-card max-w-2xl w-full rounded-2xl border border-slate-700 shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            {loading || !dino ? (
              <div className="p-12 text-center text-slate-400">
                <i className="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-emerald-500"></i>
                <p>Cargando ficha paleontológica...</p>
              </div>
            ) : (
              <div>
                {/* Header Modal con Imagen */}
                <div className="relative h-56 bg-slate-900 overflow-hidden border-b border-slate-800">
                  <DinoImage
                    src={dino.imagen_url}
                    emoji={dino.imagen_emoji}
                    alt={dino.nombre}
                    className="w-full h-full rounded-none border-none"
                  />
                  <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent flex items-end p-5">
                    <div className="w-full flex justify-between items-end">
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 uppercase">
                            {dino.periodo_nombre}
                          </span>
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-800/80 text-slate-300 border border-slate-700">
                            {dino.habitat_nombre}
                          </span>
                        </div>
                        <h2 className="text-2xl font-black text-white drop-shadow-md">{dino.nombre}</h2>
                        <p className="text-xs italic text-slate-300 drop-shadow-sm">{dino.especie}</p>
                      </div>
                      <div>
                        <SemaforoBadge score={dino.indice_mascotabilidad} size="lg" />
                      </div>
                    </div>
                  </div>
                  <button
                    onClick={onClose}
                    className="absolute top-3 right-3 text-slate-400 hover:text-white p-2 rounded-xl bg-slate-950/70 hover:bg-slate-900 border border-slate-700 transition cursor-pointer z-20"
                  >
                    <i className="fa-solid fa-xmark text-base"></i>
                  </button>
                </div>

                {/* Body Modal */}
                <div className="p-6 space-y-5 max-h-[65vh] overflow-y-auto custom-scroll">
                  {/* Veredicto de Adopción */}
                  <div className={`p-4 rounded-xl border ${
                    dino.semaforo_color === 'VERDE' ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' :
                    dino.semaforo_color === 'AMARILLO' ? 'bg-amber-950/40 border-amber-500/30 text-amber-300' :
                    'bg-red-950/40 border-red-500/30 text-red-300'
                  }`}>
                    <div className="flex items-center gap-2 font-bold text-sm mb-1">
                      <i className="fa-solid fa-shield-halved"></i>
                      <span>Veredicto de Mascotabilidad: {dino.semaforo_color}</span>
                    </div>
                    <p className="text-xs leading-relaxed">{dino.semaforo_justificacion}</p>
                  </div>

                  {/* 4 Entidades Relacionadas en SQL */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Período (Entidad 1)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.periodo_nombre}</span>
                      <span className="text-[10px] text-slate-400">{dino.periodo_era}</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Hábitat (Entidad 2)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.habitat_nombre}</span>
                      <span className="text-[10px] text-slate-400">{dino.habitat_clima}</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Dieta (Entidad 3)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.dieta_tipo}</span>
                      <span className="text-[10px] text-slate-400">{dino.consumo_diario_kg} kg/día</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Costo Mensual</span>
                      <span className="text-sm font-semibold text-emerald-400 mt-1 block">${dino.costo_mensual_usd} USD</span>
                      <span className="text-[10px] text-slate-400">Peligro: {dino.nivel_peligro_alimentacion}</span>
                    </div>
                  </div>

                  {/* Biometría */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Métricas Biométricas y Requerimientos</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Peso Total:</span>
                        <span className="font-bold text-white">{dino.peso_kg.toLocaleString()} kg</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Dimensiones:</span>
                        <span className="font-bold text-white">{dino.altura_m}m × {dino.longitud_m}m</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Velocidad Máx:</span>
                        <span className="font-bold text-white">{dino.velocidad_kmh} km/h</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Agresividad:</span>
                        <span className="font-bold text-amber-400">{dino.agresividad_1_10}/10</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Inteligencia:</span>
                        <span className="font-bold text-cyan-400">{dino.inteligencia_1_10}/10</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Espacio Mínimo:</span>
                        <span className="font-bold text-white">{dino.espacio_requerido_m2.toLocaleString()} m²</span>
                      </div>
                    </div>
                  </div>

                  {/* Observaciones */}
                  <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                    <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Notas del Veterinario Paleontólogo:</h4>
                    <p className="text-xs text-slate-400 leading-relaxed">{dino.observaciones}</p>
                  </div>
                </div>

                {/* Footer Modal */}
                <div className="p-4 bg-slate-900 border-t border-slate-800 flex justify-between items-center">
                  {onSelectForCompare && (
                    <button
                      onClick={() => {
                        onSelectForCompare(dino.id_dinosaurio);
                        onClose();
                      }}
                      className="px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 font-semibold rounded-xl text-xs border border-indigo-500/30 transition flex items-center gap-2 cursor-pointer"
                    >
                      <i className="fa-solid fa-code-compare"></i>
                      <span>Llevar al Comparador Cara a Cara</span>
                    </button>
                  )}
                  <button onClick={onClose} className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-xl transition cursor-pointer ml-auto">
                    Cerrar Ficha
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: VISTA DEL BUSCADOR MULTIFILTRO
    // =========================================================================
    function SearchView({ onOpenDetail, onSelectForCompare }) {
      const [query, setQuery] = useState('');
      const [periodoId, setPeriodoId] = useState('');
      const [habitatId, setHabitatId] = useState('');
      const [dietaId, setDietaId] = useState('');
      const [semaforo, setSemaforo] = useState('');
      const [sortBy, setSortBy] = useState('mascotabilidad_desc');
      
      const [results, setResults] = useState([]);
      const [totalCount, setTotalCount] = useState(0);
      const [loading, setLoading] = useState(true);

      const performSearch = () => {
        setLoading(true);
        const params = new URLSearchParams();
        if (query) params.append('q', query);
        if (periodoId) params.append('periodo_id', periodoId);
        if (habitatId) params.append('habitat_id', habitatId);
        if (dietaId) params.append('dieta_id', dietaId);
        if (semaforo) params.append('semaforo', semaforo);
        if (sortBy) params.append('sort_by', sortBy);

        fetch(`${API_BASE}/api/stats/search?${params.toString()}`)
          .then(res => res.json())
          .then(data => {
            setResults(data.dinosaurios || []);
            setTotalCount(data.total_resultados || 0);
            setLoading(false);
          })
          .catch(err => {
            console.error(err);
            setLoading(false);
          });
      };

      useEffect(() => {
        const timeout = setTimeout(performSearch, 200);
        return () => clearTimeout(timeout);
      }, [query, periodoId, habitatId, dietaId, semaforo, sortBy]);

      const resetFilters = () => {
        setQuery('');
        setPeriodoId('');
        setHabitatId('');
        setDietaId('');
        setSemaforo('');
        setSortBy('mascotabilidad_desc');
      };

      return (
        <div className="space-y-6">
          {/* Panel de Búsqueda y Filtros */}
          <div className="glass-card p-6 rounded-2xl border border-slate-800 space-y-4">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-3">
              <div>
                <h2 className="text-lg font-bold text-white flex items-center gap-2">
                  <i className="fa-solid fa-magnifying-glass text-emerald-400"></i>
                  <span>Buscador Avanzado de Dinosaurios</span>
                </h2>
                <p className="text-xs text-slate-400">Filtra por especie, período geológico, hábitat, dieta o nivel de riesgo.</p>
              </div>
              <button
                onClick={resetFilters}
                className="px-3.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition self-start md:self-auto cursor-pointer border border-slate-700"
              >
                <i className="fa-solid fa-rotate-left text-[10px]"></i>
                <span>Limpiar Filtros</span>
              </button>
            </div>

            {/* Input de Búsqueda Principal */}
            <div className="relative">
              <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-500">
                <i className="fa-solid fa-search"></i>
              </span>
              <input
                type="text"
                value={query}
                onChange={(e) => setQuery(e.target.value)}
                placeholder="Buscar por nombre (ej. Velociraptor, Rex, Diplodocus), especie o características..."
                className="w-full pl-11 pr-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
              />
              {query && (
                <button
                  onClick={() => setQuery('')}

                                onClick={() => setSelectedDinoId(d.id_dinosaurio)}
                                className="py-2 px-3 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 font-semibold rounded-xl text-xs border border-emerald-500/30 transition flex items-center justify-center gap-1.5 cursor-pointer"
                              >
                                <i className="fa-solid fa-file-lines text-[11px]"></i>
                                <span>Ficha Técnica</span>
                              </button>
                              <button
                                onClick={() => handleSelectForCompare(d.id_dinosaurio)}
                                className="py-2 px-3 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 font-semibold rounded-xl text-xs border border-indigo-500/30 transition flex items-center justify-center gap-1.5 cursor-pointer"
                              >
                                <i className="fa-solid fa-code-compare text-[11px]"></i>
                                <span>Comparar</span>
                              </button>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                {/* 4. SECCIÓN DE ANÁLISIS Y GRÁFICOS (CHART.JS) */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <div className="glass-card p-6 rounded-2xl border border-slate-800">
                    <h3 className="text-base font-bold text-white mb-1 flex items-center gap-2">
                      <i className="fa-solid fa-pie-chart text-emerald-400"></i>
                      <span>Distribución por Tipo de Dieta (Entidad 3)</span>
                    </h3>
                    <p className="text-xs text-slate-400 mb-4">Cantidad de especies según su régimen alimenticio (52 especies).</p>
                    <div className="h-64 relative flex items-center justify-center">
                      <canvas id="dietasChart"></canvas>
                    </div>
                  </div>

                  <div className="glass-card p-6 rounded-2xl border border-slate-800">
                    <h3 className="text-base font-bold text-white mb-1 flex items-center gap-2">
                      <i className="fa-solid fa-chart-column text-cyan-400"></i>
                      <span>Mascotabilidad y Peso por Período (Entidad 1)</span>
                    </h3>
                    <p className="text-xs text-slate-400 mb-4">Comparativa de domesticabilidad media por era geológica.</p>
                    <div className="h-64 relative flex items-center justify-center">
                      <canvas id="periodosChart"></canvas>
                    </div>
                  </div>
                </div>
              </>
            )}

            {/* PESTAÑA 2: BUSCADOR AVANZADO */}
            {currentTab === 'search' && (
              <SearchView
                onOpenDetail={(id) => setSelectedDinoId(id)}
                onSelectForCompare={handleSelectForCompare}
              />
            )}

            {/* PESTAÑA 3: COMPARADOR CARA A CARA */}
            {currentTab === 'comparator' && (
              <ComparatorView
                allDinos={allDinos}
                initialDino1Id={comparatorDino1}
                initialDino2Id={comparatorDino2}
                onOpenDetail={(id) => setSelectedDinoId(id)}
              />
            )}
          </main>

          {/* Modal Ficha Técnica */}
          <DinoModal
            dinoId={selectedDinoId}
            onClose={() => setSelectedDinoId(null)}
            onSelectForCompare={handleSelectForCompare}
          />
        </div>
      );
    }

    // =========================================================================
    // RENDERIZADOR DE CHART.JS CUANDO CARGA EL DASHBOARD
    // =========================================================================
    function initCharts() {
      fetch(`${API_BASE}/api/stats/charts/dietas`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('dietasChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: data.map(d => d.tipo.split(' ')[0]),
              datasets: [{
                data: data.map(d => d.cantidad),
                backgroundColor: ['#22c55e', '#ef4444', '#06b6d4', '#eab308', '#a855f7'],
                borderColor: '#0f172a',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });

      fetch(`${API_BASE}/api/stats/charts/periodos`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('periodosChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: data.map(d => d.periodo),
              datasets: [{
                label: 'Mascotabilidad Promedio (0-100)',
                data: data.map(d => d.mascotabilidad_promedio),
                backgroundColor: '#22c55e',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { beginAtZero: true, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
              },
              plugins: {
                legend: { labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });
    }

    // =========================================================================
    // COMPONENTE RAÍZ
    // =========================================================================
    function App() {
      const [user, setUser] = useState(null);

      const handleLoginSuccess = (userData, token) => {
        setUser(userData);
        setTimeout(initCharts, 300);
      };

      const handleLogout = () => {
        setUser(null);
      };

      if (!user) {
        return <Login onLoginSuccess={handleLoginSuccess} />;
      }

      return <Dashboard user={user} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>

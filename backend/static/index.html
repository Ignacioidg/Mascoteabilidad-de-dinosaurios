<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DinoMascota - Tablero de Control Paleontológico | UAI</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            dino: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card-hover:hover { transform: translateY(-4px); transition: all 0.25s ease; border-color: rgba(34, 197, 94, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_BASE = '';

    // =========================================================================
    // COMPONENTE: LOGIN
    // =========================================================================
    function Login({ onLoginSuccess }) {
      const [username, setUsername] = useState('admin');
      const [password, setPassword] = useState('admin123');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          const res = await fetch(`${API_BASE}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || 'Error al iniciar sesión');
          onLoginSuccess(data.user, data.token);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      const setPreset = (u, p) => {
        setUsername(u);
        setPassword(p);
        setError('');
      };

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">
          <div className="max-w-md w-full glass-card rounded-2xl p-8 shadow-2xl border border-slate-800">
            <div className="text-center mb-8">
              <div className="w-20 h-20 mx-auto bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center text-4xl mb-4 shadow-lg shadow-emerald-500/10">
                🦖
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">DinoMascota</h1>
              <p className="text-xs text-emerald-400 font-semibold tracking-wider uppercase mt-1">Tablero de Control Paleontológico</p>
              <p className="text-xs text-slate-400 mt-2">Bases de Datos Aplicada — UAI</p>
            </div>

            {error && (
              <div className="mb-6 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs flex items-center gap-2">
                <i className="fa-solid fa-triangle-exclamation text-base"></i>
                <span>{error}</span>
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Usuario</label>
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i className="fa-solid fa-user"></i>
                  </span>
                  <input
                    type="text"
                    required
                    value={username}
                    onChange={(e) => setUsername(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                    placeholder="Ingresa tu usuario"
                  />
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Contraseña</label>
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                    <i className="fa-solid fa-lock"></i>
                  </span>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition"
                    placeholder="••••••••"
                  />
                </div>
              </div>

              <button
                type="submit"
                disabled={loading}
                className="w-full py-3 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl text-sm shadow-lg shadow-emerald-600/30 transition flex items-center justify-center gap-2 mt-6 cursor-pointer"
              >
                {loading ? (
                  <>
                    <i className="fa-solid fa-circle-notch fa-spin"></i>
                    <span>Verificando credenciales SQL...</span>
                  </>
                ) : (
                  <>
                    <span>Ingresar al Tablero</span>
                    <i className="fa-solid fa-arrow-right"></i>
                  </>
                )}
              </button>
            </form>

            <div className="mt-8 pt-6 border-t border-slate-800">
              <p className="text-[11px] text-slate-400 text-center font-medium mb-3 uppercase tracking-wider">
                Credenciales de prueba registradas en BD (Hash Bcrypt):
              </p>
              <div className="grid grid-cols-3 gap-2">
                <button
                  type="button"
                  onClick={() => setPreset('admin', 'admin123')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">admin</div>
                  <div className="text-[9px] text-slate-500">admin123</div>
                </button>
                <button
                  type="button"
                  onClick={() => setPreset('profesor', 'uai2026')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">profesor</div>
                  <div className="text-[9px] text-slate-500">uai2026</div>
                </button>
                <button
                  type="button"
                  onClick={() => setPreset('alumno', 'dino123')}
                  className="p-2 rounded-lg bg-slate-900/80 hover:bg-slate-800 border border-slate-800 text-[11px] text-slate-300 text-center transition cursor-pointer"
                >
                  <div className="font-bold text-white">alumno</div>
                  <div className="text-[9px] text-slate-500">dino123</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: BADGE DE SEMAFORIZACIÓN
    // =========================================================================
    function SemaforoBadge({ score, showLabel = true }) {
      let colorClass = 'bg-red-500/20 text-red-400 border-red-500/30';
      let dotColor = 'bg-red-500';
      let label = 'ROJO • Riesgo Letal';

      if (score >= 70) {
        colorClass = 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        dotColor = 'bg-emerald-500';
        label = 'VERDE • Mascota Ideal';
      } else if (score >= 40) {
        colorClass = 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        dotColor = 'bg-amber-500';
        label = 'AMARILLO • Precaución';
      }

      return (
        <span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold border ${colorClass}`}>
          <span className={`w-2 h-2 rounded-full ${dotColor} animate-pulse`}></span>
          <span>{score}/100</span>
          {showLabel && <span className="text-[10px] opacity-80 ml-1">({label.split('•')[0].trim()})</span>}
        </span>
      );
    }

    // =========================================================================
    // COMPONENTE: MODAL DE FICHA TÉCNICA (DETALLE DEL DINOSAURIO)
    // =========================================================================
    function DinoModal({ dinoId, onClose }) {
      const [dino, setDino] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!dinoId) return;
        fetch(`${API_BASE}/api/stats/dinosaurio/${dinoId}`)
          .then(res => res.json())
          .then(data => {
            setDino(data);
            setLoading(false);
          })
          .catch(err => console.error(err));
      }, [dinoId]);

      if (!dinoId) return null;

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
          <div className="glass-card max-w-2xl w-full rounded-2xl border border-slate-700 shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-200">
            {loading ? (
              <div className="p-12 text-center text-slate-400">
                <i className="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-emerald-500"></i>
                <p>Cargando ficha paleontológica...</p>
              </div>
            ) : (
              <div>
                {/* Header Modal */}
                <div className="p-6 bg-slate-900/90 border-b border-slate-800 flex justify-between items-start">
                  <div className="flex items-center gap-4">
                    <div className="w-16 h-16 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-3xl shadow-inner">
                      {dino.imagen_emoji || '🦖'}
                    </div>
                    <div>
                      <div className="flex items-center gap-3">
                        <h2 className="text-2xl font-black text-white">{dino.nombre}</h2>
                        <SemaforoBadge score={dino.indice_mascotabilidad} />
                      </div>
                      <p className="text-xs italic text-slate-400 mt-0.5">{dino.especie}</p>
                    </div>
                  </div>
                  <button onClick={onClose} className="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-800/60 hover:bg-slate-800 transition">
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>
                </div>

                {/* Body Modal */}
                <div className="p-6 space-y-6 max-h-[75vh] overflow-y-auto custom-scroll">
                  {/* Veredicto de Adopción */}
                  <div className={`p-4 rounded-xl border ${
                    dino.semaforo_color === 'VERDE' ? 'bg-emerald-950/40 border-emerald-500/30 text-emerald-300' :
                    dino.semaforo_color === 'AMARILLO' ? 'bg-amber-950/40 border-amber-500/30 text-amber-300' :
                    'bg-red-950/40 border-red-500/30 text-red-300'
                  }`}>
                    <div className="flex items-center gap-2 font-bold text-sm mb-1">
                      <i className="fa-solid fa-shield-halved"></i>
                      <span>Veredicto de Mascotabilidad: {dino.semaforo_color}</span>
                    </div>
                    <p className="text-xs leading-relaxed">{dino.semaforo_justificacion}</p>
                  </div>

                  {/* 4 Entidades Relacionadas en SQL */}
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Período (Entidad 1)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.periodo_nombre}</span>
                      <span className="text-[10px] text-slate-400">{dino.periodo_era}</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Hábitat (Entidad 2)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.habitat_nombre}</span>
                      <span className="text-[10px] text-slate-400">{dino.habitat_clima}</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Dieta (Entidad 3)</span>
                      <span className="text-sm font-semibold text-white mt-1 block">{dino.dieta_tipo}</span>
                      <span className="text-[10px] text-slate-400">{dino.consumo_diario_kg} kg/día</span>
                    </div>
                    <div className="p-3 bg-slate-900/60 rounded-xl border border-slate-800">
                      <span className="text-[10px] text-slate-500 uppercase font-bold block">Costo Mensual</span>
                      <span className="text-sm font-semibold text-emerald-400 mt-1 block">${dino.costo_mensual_usd} USD</span>
                      <span className="text-[10px] text-slate-400">Peligro: {dino.nivel_peligro_alimentacion}</span>
                    </div>
                  </div>

                  {/* Biometría */}
                  <div>
                    <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Métricas Biométricas y Requerimientos</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 gap-3 text-xs">
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Peso Total:</span>
                        <span className="font-bold text-white">{dino.peso_kg.toLocaleString()} kg</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Dimensiones:</span>
                        <span className="font-bold text-white">{dino.altura_m}m × {dino.longitud_m}m</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Velocidad Máx:</span>
                        <span className="font-bold text-white">{dino.velocidad_kmh} km/h</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Agresividad:</span>
                        <span className="font-bold text-amber-400">{dino.agresividad_1_10}/10</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Inteligencia:</span>
                        <span className="font-bold text-cyan-400">{dino.inteligencia_1_10}/10</span>
                      </div>
                      <div className="p-2.5 bg-slate-900/40 rounded-lg border border-slate-800/80 flex justify-between">
                        <span className="text-slate-400">Espacio Mínimo:</span>
                        <span className="font-bold text-white">{dino.espacio_requerido_m2} m²</span>
                      </div>
                    </div>
                  </div>

                  {/* Observaciones */}
                  <div className="p-4 bg-slate-900/80 rounded-xl border border-slate-800">
                    <h4 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Notas del Veterinario Paleontólogo:</h4>
                    <p className="text-xs text-slate-400 leading-relaxed">{dino.observaciones}</p>
                  </div>
                </div>

                {/* Footer Modal */}
                <div className="p-4 bg-slate-900 border-t border-slate-800 flex justify-end">
                  <button onClick={onClose} className="px-5 py-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-semibold rounded-xl transition cursor-pointer">
                    Cerrar Ficha
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // COMPONENTE: TABLERO PRINCIPAL (DASHBOARD)
    // =========================================================================
    function Dashboard({ user, onLogout }) {
      const [kpis, setKpis] = useState(null);
      const [drillLevel, setDrillLevel] = useState(1); // 1 = Periodos, 2 = Habitats, 3 = Dinosaurios
      const [selectedPeriodo, setSelectedPeriodo] = useState(null);
      const [selectedHabitat, setSelectedHabitat] = useState(null);

      const [periodos, setPeriodos] = useState([]);
      const [habitatsData, setHabitatsData] = useState(null);
      const [dinosData, setDinosData] = useState(null);
      const [selectedDinoId, setSelectedDinoId] = useState(null);

      // Cargar KPIs iniciales y Nivel 1 (Períodos)
      useEffect(() => {
        fetch(`${API_BASE}/api/stats/kpis`)
          .then(res => res.json())
          .then(data => setKpis(data));

        fetch(`${API_BASE}/api/stats/drilldown/periodos`)
          .then(res => res.json())
          .then(data => setPeriodos(data));
      }, []);

      // Drill Down hacia Nivel 2 (Hábitats)
      const handleSelectPeriodo = (p) => {
        setSelectedPeriodo(p);
        fetch(`${API_BASE}/api/stats/drilldown/habitats/${p.id_periodo}`)
          .then(res => res.json())
          .then(data => {
            setHabitatsData(data);
            setDrillLevel(2);
          });
      };

      // Drill Down hacia Nivel 3 (Dinosaurios)
      const handleSelectHabitat = (h) => {
        setSelectedHabitat(h);
        fetch(`${API_BASE}/api/stats/drilldown/dinosaurios/${selectedPeriodo.id_periodo}/${h.id_habitat}`)
          .then(res => res.json())
          .then(data => {
            setDinosData(data);
            setDrillLevel(3);
          });
      };

      // Drill Up
      const handleDrillUp = (toLevel) => {
        if (toLevel === 1) {
          setDrillLevel(1);
          setSelectedPeriodo(null);
          setSelectedHabitat(null);
          setHabitatsData(null);
          setDinosData(null);
        } else if (toLevel === 2) {
          setDrillLevel(2);
          setSelectedHabitat(null);
          setDinosData(null);
        }
      };

      return (
        <div className="min-h-screen pb-16">
          {/* Top Navbar */}
          <nav className="glass-card border-b border-slate-800 sticky top-0 z-40 px-6 py-3.5 flex justify-between items-center">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-xl">
                🦖
              </div>
              <div>
                <span className="font-extrabold text-white text-base tracking-tight block">DinoMascota</span>
                <span className="text-[10px] text-emerald-400 font-semibold tracking-wider uppercase">Tablero de Control • UAI</span>
              </div>
            </div>

            <div className="flex items-center gap-4">
              <div className="hidden sm:flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-slate-900 border border-slate-800 text-xs">
                <i className="fa-solid fa-user-circle text-emerald-400 text-sm"></i>
                <span className="font-semibold text-slate-200">{user.nombre_completo}</span>
                <span className="text-[10px] px-2 py-0.5 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-bold uppercase">
                  {user.rol}
                </span>
              </div>
              <button
                onClick={onLogout}
                className="px-3.5 py-1.5 rounded-xl bg-red-500/10 hover:bg-red-500/20 border border-red-500/20 text-red-400 text-xs font-semibold transition flex items-center gap-2 cursor-pointer"
              >
                <i className="fa-solid fa-arrow-right-from-bracket"></i>
                <span className="hidden sm:inline">Cerrar Sesión</span>
              </button>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 sm:px-6 pt-8 space-y-8">
            {/* 1. SECCIÓN KPIS GLOBALES */}
            {kpis && (
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="glass-card p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Especies Analizadas</span>
                    <div className="text-3xl font-black text-white mt-1">{kpis.general.total_dinos}</div>
                    <span className="text-[11px] text-slate-500 mt-1 block">3 Períodos Geológicos</span>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 text-xl">
                    <i className="fa-solid fa-dna"></i>
                  </div>
                </div>

                <div className="glass-card p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Mascotabilidad Global</span>
                    <div className="text-3xl font-black text-emerald-400 mt-1">{kpis.general.mascotabilidad_promedio} <span className="text-sm text-slate-400">/ 100</span></div>
                    <span className="text-[11px] text-slate-500 mt-1 block">Promedio de la base de datos</span>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 text-xl">
                    <i className="fa-solid fa-chart-line"></i>
                  </div>
                </div>

                <div className="glass-card p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Mejor Candidato</span>
                    <div className="text-base font-extrabold text-white mt-1 truncate max-w-[150px]">{kpis.mejor_candidato.nombre}</div>
                    <div className="mt-1"><SemaforoBadge score={kpis.mejor_candidato.indice_mascotabilidad} showLabel={false} /></div>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-2xl">
                    {kpis.mejor_candidato.imagen_emoji}
                  </div>
                </div>

                <div className="glass-card p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
                  <div>
                    <span className="text-xs text-slate-400 uppercase font-bold tracking-wider">Mayor Peligro</span>
                    <div className="text-base font-extrabold text-red-400 mt-1 truncate max-w-[150px]">{kpis.mayor_riesgo.nombre}</div>
                    <div className="mt-1"><SemaforoBadge score={kpis.mayor_riesgo.indice_mascotabilidad} showLabel={false} /></div>
                  </div>
                  <div className="w-12 h-12 rounded-xl bg-red-500/10 border border-red-500/20 flex items-center justify-center text-2xl">
                    {kpis.mayor_riesgo.imagen_emoji}
                  </div>
                </div>
              </div>
            )}

            {/* 2. SECCIÓN DE REFERENCIA DE SEMAFORIZACIÓN (EXIGIDO POR CONSIGNAS) */}
            <div className="glass-card p-6 rounded-2xl border border-slate-800">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                <div>
                  <h2 className="text-lg font-bold text-white flex items-center gap-2">
                    <i className="fa-solid fa-traffic-light text-emerald-400"></i>
                    <span>Criterios de Semaforización (Índice de Mascotabilidad)</span>
                  </h2>
                  <p className="text-xs text-slate-400 mt-0.5">Indicador de 3 estados basado en biometría, temperamento, dieta y espacio requerido.</p>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="p-4 rounded-xl bg-emerald-950/30 border border-emerald-500/30">
                  <div className="flex items-center gap-2 text-emerald-400 font-bold text-sm mb-1">
                    <span className="w-3 h-3 rounded-full bg-emerald-500"></span>
                    <span>🟢 VERDE (70 a 100 pts)</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed font-medium">Situación Óptima / Favorable</p>
                  <p className="text-[11px] text-slate-400 mt-1">Especies pequeñas, dóciles, con baja agresividad y alimentación económica. Aptos para convivencia familiar.</p>
                </div>

                <div className="p-4 rounded-xl bg-amber-950/30 border border-amber-500/30">
                  <div className="flex items-center gap-2 text-amber-400 font-bold text-sm mb-1">
                    <span className="w-3 h-3 rounded-full bg-amber-500"></span>
                    <span>🟡 AMARILLO (40 a 69 pts)</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed font-medium">Situación de Advertencia / Cuidado</p>
                  <p className="text-[11px] text-slate-400 mt-1">Especies de tamaño medio o gran porte pacífico. Requieren predios de más de 1.000 m² y adiestramiento.</p>
                </div>

                <div className="p-4 rounded-xl bg-red-950/30 border border-red-500/30">
                  <div className="flex items-center gap-2 text-red-400 font-bold text-sm mb-1">
                    <span className="w-3 h-3 rounded-full bg-red-500"></span>
                    <span>🔴 ROJO (0 a 39 pts)</span>
                  </div>
                  <p className="text-xs text-slate-300 leading-relaxed font-medium">Situación Crítica / Peligro Inminente</p>
                  <p className="text-[11px] text-slate-400 mt-1">Superdepredadores carnívoros o gigantes incontrolables. Riesgo de muerte para humanos y mascotas del vecindario.</p>
                </div>
              </div>
            </div>

            {/* 3. EXPLORADOR DRILL-DOWN / DRILL-UP (3 NIVELES OBLIGATORIOS) */}
            <div className="glass-card p-6 rounded-2xl border border-slate-800">
              {/* Barra de Navegación Drill-Down / Drill-Up */}
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 mb-6 border-b border-slate-800">
                <div>
                  <div className="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">
                    <span>Navegación Multinivel (Drill-Down / Drill-Up)</span>
                  </div>
                  <div className="flex items-center gap-2 text-sm">
                    <button
                      onClick={() => handleDrillUp(1)}
                      className={`font-semibold hover:text-emerald-400 transition cursor-pointer ${drillLevel === 1 ? 'text-emerald-400' : 'text-slate-400'}`}
                    >
                      <i className="fa-solid fa-clock-rotate-left mr-1"></i> Nivel 1: Períodos
                    </button>

                    {drillLevel >= 2 && selectedPeriodo && (
                      <>
                        <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <button
                          onClick={() => handleDrillUp(2)}
                          className={`font-semibold hover:text-emerald-400 transition cursor-pointer ${drillLevel === 2 ? 'text-emerald-400' : 'text-slate-400'}`}
                        >
                          <i className="fa-solid fa-tree mr-1"></i> Nivel 2: {selectedPeriodo.periodo_nombre || selectedPeriodo.nombre}
                        </button>
                      </>
                    )}

                    {drillLevel === 3 && selectedHabitat && (
                      <>
                        <i className="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                        <span className="font-semibold text-emerald-400">
                          <i className="fa-solid fa-paw mr-1"></i> Nivel 3: {selectedHabitat.habitat_nombre || selectedHabitat.nombre}
                        </span>
                      </>
                    )}
                  </div>
                </div>

                {/* Botones Drill Up */}
                {drillLevel > 1 && (
                  <button
                    onClick={() => handleDrillUp(drillLevel - 1)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-semibold flex items-center gap-2 transition cursor-pointer self-start border border-slate-700"
                  >
                    <i className="fa-solid fa-arrow-up"></i>
                    <span>Volver al Nivel Anterior (Drill-Up)</span>
                  </button>
                )}
              </div>

              {/* NIVEL 1: PERÍODOS */}
              {drillLevel === 1 && (
                <div>
                  <div className="mb-4">
                    <h3 className="text-base font-bold text-white">Selecciona un Período Geológico para desglosar</h3>
                    <p className="text-xs text-slate-400">Consulta SQL agrupada por Era y Período histórico.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {periodos.map(p => (
                      <div
                        key={p.id_periodo}
                        onClick={() => handleSelectPeriodo(p)}
                        className="glass-card glass-card-hover p-6 rounded-2xl border border-slate-800 cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex justify-between items-start mb-3">
                            <span className="text-[10px] font-bold px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 uppercase">
                              {p.era}
                            </span>
                            <span className="text-xs font-bold text-slate-400">
                              {p.millones_anios_inicio} - {p.millones_anios_fin} Ma
                            </span>
                          </div>
                          <h4 className="text-xl font-extrabold text-white mb-1">{p.periodo_nombre}</h4>
                          <p className="text-xs text-slate-400 line-clamp-2 mb-4">{p.descripcion}</p>
                        </div>

                        <div className="pt-4 border-t border-slate-800/80 space-y-2">
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-400">Especies en Base de Datos:</span>
                            <span className="font-bold text-white">{p.total_especies}</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-400">Mascotabilidad Media:</span>
                            <span className="font-bold text-emerald-400">{p.promedio_mascotabilidad} / 100</span>
                          </div>
                          <div className="flex justify-between text-xs">
                            <span className="text-slate-400">Peso Promedio:</span>
                            <span className="font-bold text-slate-300">{p.peso_promedio_kg.toLocaleString()} kg</span>
                          </div>
                          <div className="mt-3 pt-2 text-center text-xs text-emerald-400 font-semibold flex items-center justify-center gap-1">
                            <span>Explorar Hábitats</span>
                            <i className="fa-solid fa-arrow-right text-[10px]"></i>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* NIVEL 2: HÁBITATS */}
              {drillLevel === 2 && habitatsData && (
                <div>
                  <div className="mb-4">
                    <h3 className="text-base font-bold text-white">
                      Hábitats del período <span className="text-emerald-400">{habitatsData.periodo?.nombre}</span>
                    </h3>
                    <p className="text-xs text-slate-400">Selecciona un hábitat para visualizar las especies asociadas en esta era.</p>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {habitatsData.habitats.map(h => (
                      <div
                        key={h.id_habitat}
                        onClick={() => handleSelectHabitat(h)}
                        className="glass-card glass-card-hover p-5 rounded-2xl border border-slate-800 cursor-pointer flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="text-xs font-bold text-white">{h.habitat_nombre}</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-medium">
                              {h.clima}
                            </span>
                          </div>
                          <p className="text-xs text-slate-400 mb-3">{h.tipo_terreno}</p>
                        </div>

                        <div className="pt-3 border-t border-slate-800/80 space-y-1.5 text-xs">
                          <div className="flex justify-between">
                            <span className="text-slate-400">Especies presentes:</span>
                            <span className="font-bold text-emerald-400">{h.total_especies}</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Mascotabilidad en Hábitat:</span>
                            <span className="font-bold text-white">{h.promedio_mascotabilidad}/100</span>
                          </div>
                          <div className="flex justify-between">
                            <span className="text-slate-400">Espacio mínimo sugerido:</span>
                            <span className="font-bold text-slate-300">{h.superficie_minima_m2} m²</span>
                          </div>
                          <div className="mt-3 pt-2 text-center text-xs text-emerald-400 font-semibold flex items-center justify-center gap-1">
                            <span>Ver Especies</span>
                            <i className="fa-solid fa-arrow-right text-[10px]"></i>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* NIVEL 3: DINOSAURIOS */}
              {drillLevel === 3 && dinosData && (
                <div>
                  <div className="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                    <div>
                      <h3 className="text-base font-bold text-white">
                        Especies en <span className="text-emerald-400">{dinosData.habitat?.nombre}</span> ({dinosData.periodo?.nombre})
                      </h3>
                      <p className="text-xs text-slate-400">Mostrando {dinosData.dinosaurios.length} dinosaurios ordenados por índice de aptitud.</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                    {dinosData.dinosaurios.map(d => (
                      <div
                        key={d.id_dinosaurio}
                        className="glass-card p-5 rounded-2xl border border-slate-800 flex flex-col justify-between"
                      >
                        <div>
                          <div className="flex justify-between items-start mb-3">
                            <div className="w-12 h-12 rounded-xl bg-slate-800 border border-slate-700 flex items-center justify-center text-2xl">
                              {d.imagen_emoji || '🦖'}
                            </div>
                            <SemaforoBadge score={d.indice_mascotabilidad} />
                          </div>

                          <h4 className="text-lg font-black text-white">{d.nombre}</h4>
                          <p className="text-xs italic text-slate-400 mb-3">{d.especie}</p>

                          <div className="grid grid-cols-2 gap-2 text-xs mb-3">
                            <div className="p-2 bg-slate-900/60 rounded-lg border border-slate-800">
                              <span className="text-[10px] text-slate-500 block">Peso</span>
                              <span className="font-bold text-white">{d.peso_kg} kg</span>
                            </div>
                            <div className="p-2 bg-slate-900/60 rounded-lg border border-slate-800">
                              <span className="text-[10px] text-slate-500 block">Dieta</span>
                              <span className="font-bold text-slate-200 truncate block">{d.dieta_tipo.split(' ')[0]}</span>
                            </div>
                          </div>

                          <p className="text-xs text-slate-400 line-clamp-2 mb-4">{d.observaciones}</p>
                        </div>

                        <button
                          onClick={() => setSelectedDinoId(d.id_dinosaurio)}
                          className="w-full py-2.5 bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-400 hover:text-emerald-300 font-semibold rounded-xl text-xs border border-emerald-500/30 transition flex items-center justify-center gap-2 cursor-pointer"
                        >
                          <i className="fa-solid fa-file-lines"></i>
                          <span>Ver Ficha Técnica Completa</span>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>

            {/* 4. SECCIÓN DE ANÁLISIS Y GRÁFICOS (CHART.JS) */}
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
              <div className="glass-card p-6 rounded-2xl border border-slate-800">
                <h3 className="text-base font-bold text-white mb-1 flex items-center gap-2">
                  <i className="fa-solid fa-pie-chart text-emerald-400"></i>
                  <span>Distribución por Tipo de Dieta (Entidad 3)</span>
                </h3>
                <p className="text-xs text-slate-400 mb-4">Cantidad de especies según su régimen alimenticio.</p>
                <div className="h-64 relative flex items-center justify-center">
                  <canvas id="dietasChart"></canvas>
                </div>
              </div>

              <div className="glass-card p-6 rounded-2xl border border-slate-800">
                <h3 className="text-base font-bold text-white mb-1 flex items-center gap-2">
                  <i className="fa-solid fa-chart-column text-cyan-400"></i>
                  <span>Mascotabilidad y Peso por Período (Entidad 1)</span>
                </h3>
                <p className="text-xs text-slate-400 mb-4">Comparativa de domesticabilidad media por era geológica.</p>
                <div className="h-64 relative flex items-center justify-center">
                  <canvas id="periodosChart"></canvas>
                </div>
              </div>
            </div>
          </main>

          {/* Modal Ficha Técnica */}
          <DinoModal dinoId={selectedDinoId} onClose={() => setSelectedDinoId(null)} />
        </div>
      );
    }

    // =========================================================================
    // RENDERIZADOR DE CHART.JS CUANDO CARGA EL DASHBOARD
    // =========================================================================
    function initCharts() {
      fetch(`${API_BASE}/api/stats/charts/dietas`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('dietasChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: data.map(d => d.tipo.split(' ')[0]),
              datasets: [{
                data: data.map(d => d.cantidad),
                backgroundColor: ['#22c55e', '#ef4444', '#06b6d4', '#eab308', '#a855f7'],
                borderColor: '#0f172a',
                borderWidth: 2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });

      fetch(`${API_BASE}/api/stats/charts/periodos`)
        .then(res => res.json())
        .then(data => {
          const ctx = document.getElementById('periodosChart');
          if (!ctx) return;
          new Chart(ctx, {
            type: 'bar',
            data: {
              labels: data.map(d => d.periodo),
              datasets: [{
                label: 'Mascotabilidad Promedio (0-100)',
                data: data.map(d => d.mascotabilidad_promedio),
                backgroundColor: '#22c55e',
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: { beginAtZero: true, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
              },
              plugins: {
                legend: { labels: { color: '#94a3b8', font: { size: 11 } } }
              }
            }
          });
        });
    }

    // =========================================================================
    // COMPONENTE RAÍZ
    // =========================================================================
    function App() {
      const [user, setUser] = useState(null);

      const handleLoginSuccess = (userData, token) => {
        setUser(userData);
        setTimeout(initCharts, 300);
      };

      const handleLogout = () => {
        setUser(null);
      };

      if (!user) {
        return <Login onLoginSuccess={handleLoginSuccess} />;
      }

      return <Dashboard user={user} onLogout={handleLogout} />;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
